name: Docs

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Markdown 链接检查
  # ===========================================================================
  markdown-link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run markdown-link-check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
          config-file: ".github/link-check-config.json"
          folder-path: "."
          file-path: "./README.md,./AGENTS.md,./docs/*.md"

  # ===========================================================================
  # 文档拼写检查
  # ===========================================================================
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell
        run: codespell --skip=".git,*.pyc,*.pyo,__pycache__,*.egg-info,build,dist,.mypy_cache,.ruff_cache,.pytest_cache" --ignore-words=.codespellrc || true

  # ===========================================================================
  # 文档构建检查（如果有 Sphinx 或其他文档工具）
  # ===========================================================================
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f AGENTS.md
          echo "✅ All required documentation files exist"
